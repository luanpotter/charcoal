name: charcoal_builder
description: >-
  The build_runner generator for charcoal. Writes ultra-fast JSON, copy,
  equals, hash code, and toString, with the type graph resolved at build time.
version: 0.0.2
repository: https://github.com/luanpotter/charcoal/tree/main/packages/charcoal_builder
issue_tracker: https://github.com/luanpotter/charcoal/issues
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: ^14.7.0
  build: ^5.0.0
  charcoal: ^0.0.2
  dart_style: ^3.1.14

dev_dependencies:
  build_test: ^3.5.23
  test: ^1.33.0
