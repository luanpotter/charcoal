name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install lint tools
        run: |
          sudo apt-get install -y shellcheck shfmt
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/actionlint" /usr/local/bin/
          npm install -g markdownlint-cli@~0.49.0 cspell@~10.0.1
      - name: Build
        run: scripts/build.sh
      - name: Lint
        run: scripts/lint.sh
      - name: Test
        run: scripts/test.sh
