name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build
        run: scripts/build.sh
      - name: Lint
        run: scripts/lint.sh
      - name: Test
        run: scripts/test.sh
