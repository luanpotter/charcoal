name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: scripts/check.sh

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # also creates the OIDC token that pub.dev authenticates
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: scripts/publish.sh
